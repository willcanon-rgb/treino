<title>Treino</title>
<style>
:root{--bg:#F3F1F1;--card:#fff;--ink:#161A20;--muted:#5E6875;--line:#E2DCDC;--accent:#C4282F;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1B1F24;--ink:#E9ECEF;--muted:#9AA3AE;--line:#2B3138;--accent:#E5484D;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
h1{margin:4px 0 0;font-size:22px}
p{margin:0;color:var(--muted);font-size:14px}
input{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;font-size:17px;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--accent);min-height:20px;font-weight:600}
</style></head><body>
<form id="f" hidden>
  <img src="icon-180.png" alt="">
  <h1>Treino do Will</h1>
  <p>Digite a senha. Este aparelho vai lembrar dela.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
  <button id="go" type="submit">Abrir</button>
  <div id="err" role="alert"></div>
</form>

  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
async function fromPw(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
(async()=>{const f=document.getElementById('f');
  let saved=null;try{saved=localStorage.getItem('treinoKey')}catch(_){}
  if(saved){try{const k=await crypto.subtle.importKey('raw',d(saved),'AES-GCM',true,['decrypt']);await open_(k);return}catch(_){try{localStorage.removeItem('treinoKey')}catch(__){}}}
  f.hidden=false;document.getElementById('pw').focus();
  f.addEventListener('submit',async ev=>{ev.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
    b.disabled=true;b.textContent='Abrindo…';er.textContent='';
    try{const k=await fromPw(document.getElementById('pw').value);const raw=await crypto.subtle.exportKey('raw',k);
      await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(P.c));
      try{localStorage.setItem('treinoKey',e(raw))}catch(_){}
      await open_(k)}
    catch(_){er.textContent='Senha incorreta. Tente de novo.';b.disabled=false;b.textContent='Abrir'}})})();
